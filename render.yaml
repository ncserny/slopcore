services:
  - type: web
    runtime: static
    name: slopcore
    repo: https://github.com/ncserny/slopcore
    branch: main
    buildCommand: npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    domains:
      - slopcore.nader.io
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /data/*
        name: Cache-Control
        value: no-cache
      - path: /optimized/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
